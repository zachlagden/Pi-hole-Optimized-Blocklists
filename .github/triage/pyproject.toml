[project]
name = "issue-triage"
version = "0.1.0"
description = "Evidence bot for block and false-positive issues"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "playwright>=1.49",
    "tldextract>=5.1",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
