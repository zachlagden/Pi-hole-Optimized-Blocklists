[project]
name = "issue-triage"
version = "0.2.0"
description = "Evidence bot for block and false-positive issues"
requires-python = ">=3.12"
dependencies = [
    "charset-normalizer>=3.5.1",
    "httpx>=0.28",
    "pillow>=12.0",
    "playwright>=1.49",
    "tldextract>=5.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "pyyaml>=6.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
